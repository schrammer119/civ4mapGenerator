[workspace]
name = "planetsim-map-generator"
version = "0.1.0"
description = "Development and validation environments for the PlanetSim Civilization IV map script"
requires-pixi = ">=0.46.0"
channels = ["conda-forge"]
platforms = ["win-64"]

[activation.env]
PYTHONDONTWRITEBYTECODE = "1"

[environments]
runtime = ["runtime"]
default = ["dev"]

[feature.runtime]
channels = ["conda-forge", "https://repo.anaconda.com/pkgs/main"]

[feature.runtime.dependencies]
python = { version = "2.7.*", channel = "conda-forge" }
vc = { version = "9.*", channel = "https://repo.anaconda.com/pkgs/main" }

[feature.dev.dependencies]
python = ">=3.15,<4"
numpy = ">=2.5,<3"
matplotlib = ">=3.11,<4"
pytest = ">=9.2,<10"
black = ">=26.1,<27"
vermin = ">=1.9,<2"
ruff = ">=0.17,<1"
vulture = ">=2.16,<3"

[tasks]
unit = { cmd = "pytest -q tests", env = { MPLBACKEND = "Agg" } }
generate = { cmd = "python tests/run_planetsim.py --headless", env = { MPLBACKEND = "Agg" } }
generate-map = "python tests/run_planetsim.py --show"
format = "black ."
format-check = "black --check ."
compat = { depends-on = ["compat-vermin", "compat-syntax"] }
compat-vermin = "vermin -t=2.4 --violations PlanetSim.py"
compat-syntax = "pytest -q tests/test_compat.py"
lint = "ruff check PlanetSim.py tests"
dead-code = "vulture PlanetSim.py tests --min-confidence 60"
preflight = { depends-on = [
	"format-check",
	"compat",
	"lint",
	"dead-code",
	"unit",
	"generate",
] }
